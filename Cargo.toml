[workspace]
members = [
    "crates/blade-core",
    "crates/blade-syntax",
    "crates/blade-ui",
    "crates/blade-lsp", "crates/blade-terminal",
    "crates/blade-dap", "crates/blade-plugin", "crates/blade-vshost",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Blade Contributors"]
license = "MIT"
description = "A lightweight CLI IDE with VS Code-like features"

[workspace.dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Text buffer
ropey = "1.6"

# Syntax highlighting
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml = "0.20"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-markdown = "0.7"

# LSP
lsp-types = "0.97"

# Async
tokio = { version = "1", features = ["full"] }

# Utilities
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
unicode-width = "0.2"
unicode-segmentation = "1.12"
arboard = "3"       # clipboard
notify = "7"        # file watcher
nucleo = "0.5"      # fuzzy matching
git2 = "0.19"       # git integration

[package]
name = "blade"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "blade"
path = "src/main.rs"

[dependencies]
blade-core = { path = "crates/blade-core" }
blade-syntax = { path = "crates/blade-syntax" }
blade-ui = { path = "crates/blade-ui" }
blade-lsp = { path = "crates/blade-lsp" }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
dirs.workspace = true
crossterm.workspace = true
ratatui.workspace = true
